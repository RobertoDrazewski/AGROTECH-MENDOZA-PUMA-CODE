<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="640" fill="#0e1512"/>
  <text x="30" y="40" fill="#ffffff" font-size="22" font-weight="bold" font-style="italic">AgroTech Mendoza · Diagrama de conexiones — Nodo Sensor ESP32 + LoRa</text>
  <text x="30" y="62" fill="#9bcc44" font-size="13" font-weight="bold">by puma-code.com · alimentación solar autónoma</text>

  <!-- ESP32 -->
  <rect x="360" y="200" width="200" height="240" rx="10" fill="#18211b" stroke="#9bcc44" stroke-width="2"/>
  <text x="460" y="228" fill="#9bcc44" font-size="16" font-weight="bold" text-anchor="middle">ESP32-WROOM-32</text>
  <text x="460" y="246" fill="#8a9787" font-size="11" text-anchor="middle">MCU + WiFi/BLE</text>
  <!-- pines izquierda -->
  <text x="372" y="278" fill="#cdd8c8" font-size="11">3V3</text>
  <text x="372" y="300" fill="#cdd8c8" font-size="11">GND</text>
  <text x="372" y="322" fill="#cdd8c8" font-size="11">GPIO4  (1-Wire)</text>
  <text x="372" y="344" fill="#cdd8c8" font-size="11">GPIO34 (ADC suelo)</text>
  <text x="372" y="366" fill="#cdd8c8" font-size="11">GPIO21 (SDA)</text>
  <text x="372" y="388" fill="#cdd8c8" font-size="11">GPIO22 (SCL)</text>
  <!-- pines derecha (SPI LoRa) -->
  <text x="548" y="278" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO5  (SS)</text>
  <text x="548" y="300" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO18 (SCK)</text>
  <text x="548" y="322" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO19 (MISO)</text>
  <text x="548" y="344" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO23 (MOSI)</text>
  <text x="548" y="366" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO14 (RST)</text>
  <text x="548" y="388" fill="#cdd8c8" font-size="11" text-anchor="end">GPIO2  (DIO0)</text>

  <!-- LoRa module -->
  <rect x="700" y="250" width="180" height="120" rx="10" fill="#18211b" stroke="#c0395f" stroke-width="2"/>
  <text x="790" y="278" fill="#c0395f" font-size="14" font-weight="bold" text-anchor="middle">LoRa SX1276</text>
  <text x="790" y="296" fill="#8a9787" font-size="10" text-anchor="middle">RFM95 · 915 MHz</text>
  <text x="790" y="320" fill="#cdd8c8" font-size="10" text-anchor="middle">SCK·MISO·MOSI·NSS</text>
  <text x="790" y="336" fill="#cdd8c8" font-size="10" text-anchor="middle">RST·DIO0 · 3V3·GND</text>
  <line x1="700" y1="300" x2="560" y2="320" stroke="#c0395f" stroke-width="2"/>
  <!-- antena -->
  <line x1="790" y1="250" x2="790" y2="220" stroke="#c0395f" stroke-width="2"/>
  <path d="M790 220 l-8 -14 M790 220 l8 -14 M790 220 l0 -16" stroke="#c0395f" stroke-width="2" fill="none"/>
  <text x="808" y="212" fill="#8a9787" font-size="10">ANT 915MHz</text>

  <!-- Sensores (izquierda) -->
  <g>
    <rect x="40" y="250" width="170" height="40" rx="8" fill="#18211b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="125" y="268" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">DS18B20</text>
    <text x="125" y="283" fill="#8a9787" font-size="9" text-anchor="middle">Temp. suelo · 1-Wire (GPIO4)</text>
    <line x1="210" y1="270" x2="360" y2="322" stroke="#22d3ee" stroke-width="1.5"/>

    <rect x="40" y="300" width="170" height="40" rx="8" fill="#18211b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="125" y="318" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Suelo capacitivo</text>
    <text x="125" y="333" fill="#8a9787" font-size="9" text-anchor="middle">Humedad suelo · ADC (GPIO34)</text>
    <line x1="210" y1="320" x2="360" y2="344" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="40" y="350" width="170" height="40" rx="8" fill="#18211b" stroke="#9bcc44" stroke-width="1.5"/>
    <text x="125" y="368" fill="#9bcc44" font-size="12" font-weight="bold" text-anchor="middle">SHT31</text>
    <text x="125" y="383" fill="#8a9787" font-size="9" text-anchor="middle">Temp/Hum aire · I2C (SDA/SCL)</text>
    <line x1="210" y1="370" x2="360" y2="366" stroke="#9bcc44" stroke-width="1.5"/>

    <rect x="40" y="400" width="170" height="40" rx="8" fill="#18211b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="125" y="418" fill="#a78bfa" font-size="12" font-weight="bold" text-anchor="middle">BMP280</text>
    <text x="125" y="433" fill="#8a9787" font-size="9" text-anchor="middle">Presión · I2C (SDA/SCL)</text>
    <line x1="210" y1="420" x2="360" y2="380" stroke="#a78bfa" stroke-width="1.5"/>
  </g>

  <!-- Cadena de energía (abajo) -->
  <g>
    <rect x="40" y="500" width="150" height="70" rx="10" fill="#18211b" stroke="#fbbf24" stroke-width="2"/>
    <text x="115" y="528" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Panel Solar</text>
    <text x="115" y="546" fill="#8a9787" font-size="10" text-anchor="middle">6V · 2W</text>
    <text x="115" y="560" fill="#8a9787" font-size="9" text-anchor="middle">policristalino</text>

    <rect x="230" y="500" width="150" height="70" rx="10" fill="#18211b" stroke="#fbbf24" stroke-width="2"/>
    <text x="305" y="528" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">TP4056</text>
    <text x="305" y="546" fill="#8a9787" font-size="10" text-anchor="middle">Cargador Li-Ion</text>
    <text x="305" y="560" fill="#8a9787" font-size="9" text-anchor="middle">+ protección DW01</text>

    <rect x="420" y="500" width="150" height="70" rx="10" fill="#18211b" stroke="#fbbf24" stroke-width="2"/>
    <text x="495" y="528" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Batería 18650</text>
    <text x="495" y="546" fill="#8a9787" font-size="10" text-anchor="middle">3.7V · 3000mAh</text>

    <rect x="610" y="500" width="150" height="70" rx="10" fill="#18211b" stroke="#fbbf24" stroke-width="2"/>
    <text x="685" y="528" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">LDO 3.3V</text>
    <text x="685" y="546" fill="#8a9787" font-size="10" text-anchor="middle">MCP1700</text>
    <text x="685" y="560" fill="#8a9787" font-size="9" text-anchor="middle">regulador</text>

    <!-- flechas energía -->
    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0 0 L8 3 L0 6 z" fill="#fbbf24"/>
      </marker>
    </defs>
    <line x1="190" y1="535" x2="228" y2="535" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="380" y1="535" x2="418" y2="535" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="570" y1="535" x2="608" y2="535" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <!-- LDO -> ESP32 3V3 -->
    <line x1="685" y1="500" x2="685" y2="460" stroke="#fbbf24" stroke-width="2"/>
    <line x1="685" y1="460" x2="360" y2="278" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
    <text x="690" y="478" fill="#fbbf24" font-size="10">3.3V → ESP32 / sensores / LoRa</text>
  </g>

  <!-- Actuador riego opcional -->
  <rect x="610" y="120" width="270" height="60" rx="10" fill="#18211b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="745" y="144" fill="#3b82f6" font-size="12" font-weight="bold" text-anchor="middle">Riego (opcional): Relé / H-bridge → Electroválvula 12V latch</text>
  <text x="745" y="162" fill="#8a9787" font-size="10" text-anchor="middle">Comando por downlink LoRaWAN desde la plataforma</text>
  <line x1="610" y1="150" x2="560" y2="240" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="30" y="612" fill="#5d6f5a" font-size="10">Notas: niveles lógicos 3.3V. I2C compartido (SDA=GPIO21, SCL=GPIO22). Calibrar ADC del sensor capacitivo (seco/húmedo). Banda LoRa AR/AU915 MHz.</text>
</svg>
